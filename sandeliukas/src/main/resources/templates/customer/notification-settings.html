<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pranešimų nustatymai - Sandėliukas</title>
    <style>
        body {
            background: #0f1112;
            color: #dce3e8;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        main {
            width: 430px;
            background: #181c1e;
            border: 1px solid #2a3035;
            padding: 28px;
        }

        h1 {
            color: #f5a623;
            margin: 0 0 20px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 18px 0;
        }

        input {
            width: 18px;
            height: 18px;
        }

        a, button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 14px;
            padding: 12px;
            border: 1px solid #f5a623;
            background: transparent;
            color: #f5a623;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #f5a623;
            color: #000;
        }

        .success {
            background: rgba(46, 204, 113, .12);
            color: #2ecc71;
            padding: 10px;
            margin-bottom: 14px;
        }
    </style>
</head>
<body>
<main>
    <h1>Pranešimų nustatymai</h1>

    <div th:if="${success}" class="success" th:text="${success}"></div>

    <form th:action="@{/customer/notifications/settings}" method="post">
        <label>
            <input type="checkbox" name="showSystemNotifications" value="true"
                   th:checked="${user.showSystemNotifications}">
            Rodyti sistemos pranešimus
        </label>

        <label>
            <input type="checkbox" name="showMessageNotifications" value="true"
                   th:checked="${user.showMessageNotifications}">
            Rodyti žinučių pranešimus
        </label>

        <button type="submit">Išsaugoti</button>
    </form>

    <a th:href="@{/customer/notifications}">Grįžti į pranešimus</a>
</main>
</body>
</html>
