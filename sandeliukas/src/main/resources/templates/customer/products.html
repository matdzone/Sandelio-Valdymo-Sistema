<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prekių katalogas — Sandėliukas</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0f1112;--surface:#181c1e;--border:#2a3035;--accent:#f5a623;--text:#dce3e8;--muted:#5a6672;--green:#2ecc71;--red:#e8380d; }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:14px;min-height:100vh}
        .hazard-bar{height:6px;background:repeating-linear-gradient(-45deg,var(--accent) 0,var(--accent) 12px,#1a1a1a 12px,#1a1a1a 24px)}
        header{background:var(--surface);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;padding:0 40px;gap:16px}
        .logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;color:var(--accent);line-height:1}
        .logo span{color:var(--muted);font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:2px;display:block;margin-top:2px}
        .header-sep{flex:1}
        .nav-link{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);text-decoration:none;border:1px solid var(--accent);padding:4px 12px;letter-spacing:1px}
        .nav-link:hover{background:var(--accent);color:#000}
        .header-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);border:1px solid var(--border);padding:4px 10px;letter-spacing:1px}
        main{max-width:1200px;margin:0 auto;padding:48px 40px 80px}
        .page-title{display:flex;align-items:baseline;gap:20px;margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid var(--border)}
        .page-title h1{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:4px;color:var(--text);line-height:1}
        .section-id{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);border:1px solid var(--accent);padding:3px 8px;letter-spacing:2px}
        .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:24px}

        .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
        .product-card{background:var(--surface);border:1px solid var(--border);padding:20px;text-decoration:none;color:var(--text);display:block;transition:border-color .2s,transform .15s}
        .product-card:hover{border-color:var(--accent);transform:translateY(-2px)}
        .card-id{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;margin-bottom:8px}
        .card-name{font-weight:600;font-size:14px;margin-bottom:12px;line-height:1.4}
        .card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
        .card-price{font-family:'IBM Plex Mono',monospace;font-size:16px;color:var(--accent);font-weight:600}
        .card-stock{font-family:'IBM Plex Mono',monospace;font-size:11px}
        .low{color:var(--red)} .ok{color:var(--green)}
        .card-arrow{color:var(--muted);font-size:18px}

        .pagination{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:40px;padding-top:32px;border-top:1px solid var(--border)}
        .page-btn{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);border:1px solid var(--border);padding:8px 14px;text-decoration:none;letter-spacing:1px;transition:all .2s}
        .page-btn:hover{border-color:var(--accent);color:var(--accent)}
        .page-btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
        .page-btn.disabled{opacity:.3;pointer-events:none}
    </style>
</head>
<body>
<div class="hazard-bar"></div>
<header>
    <div class="logo">Sandėliukas<span>WAREHOUSE MANAGEMENT SYSTEM</span></div>
    <div class="header-sep"></div>
    <a class="nav-link" th:href="@{/customer/cart}">🛒 Krepšelis</a>
    <a class="nav-link" th:href="@{/customer/menu}">Meniu</a>
    <div class="header-badge">WMS v1.0</div>
</header>
<main>
    <div class="page-title">
        <h1>Prekių katalogas</h1>
        <span class="section-id">CATALOG-01</span>
    </div>
    <p class="meta">
        Iš viso: <strong th:text="${totalProducts}"></strong> prekių &nbsp;|&nbsp;
        Puslapis <strong th:text="${currentPage}"></strong> iš <strong th:text="${totalPages}"></strong>
    </p>

    <div class="product-grid">
        <a class="product-card"
           th:each="product : ${products}"
           th:href="@{/customer/products/{id}/view(id=${product.id})}">
            <div class="card-id">PRD-<span th:text="${product.id}"></span></div>
            <div class="card-name" th:text="${product.name}"></div>
            <div class="card-footer">
                <span class="card-price"><span th:text="${#numbers.formatDecimal(product.supplierPrice, 1, 2)}"></span> €</span>
                <span class="card-stock"
                      th:classappend="${product.initialStock < 5 ? 'low' : 'ok'}"
                      th:text="${product.initialStock} + ' vnt.'"></span>
                <span class="card-arrow">›</span>
            </div>
        </a>
    </div>

    <div class="pagination" th:if="${totalPages > 1}">
        <a class="page-btn"
           th:classappend="${currentPage == 1 ? ' disabled' : ''}"
           th:href="@{/customer/products(page=${currentPage - 1})}">← Ankst.</a>

        <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
            <a class="page-btn"
               th:classappend="${i == currentPage ? ' active' : ''}"
               th:href="@{/customer/products(page=${i})}"
               th:text="${i}"></a>
        </th:block>

        <a class="page-btn"
           th:classappend="${currentPage == totalPages ? ' disabled' : ''}"
           th:href="@{/customer/products(page=${currentPage + 1})}">Kitas →</a>
    </div>
</main>
</body>
</html>
