<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prisijungti - Sandėliukas</title>
    <style>
        body {
            background: #0f1112;
            color: #dce3e8;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .auth-box {
            width: 360px;
            background: #181c1e;
            border: 1px solid #2a3035;
            padding: 28px;
        }

        h1 {
            margin: 0 0 22px;
            color: #f5a623;
            font-size: 28px;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-size: 13px;
            color: #9aa6b2;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #2a3035;
            background: #0d1013;
            color: #dce3e8;
            box-sizing: border-box;
        }

        button, .link-button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 18px;
            padding: 12px;
            text-align: center;
            border: 0;
            background: #f5a623;
            color: #000;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .link-button {
            background: transparent;
            color: #f5a623;
            border: 1px solid #f5a623;
        }

        .flash {
            padding: 10px;
            margin-bottom: 14px;
            font-size: 13px;
        }

        .error { background: rgba(232, 56, 13, .12); color: #ff6b4a; }
        .success { background: rgba(46, 204, 113, .12); color: #2ecc71; }
    </style>
</head>
<body>
<main class="auth-box">
    <h1>Prisijungti</h1>

    <div th:if="${error}" class="flash error" th:text="${error}"></div>
    <div th:if="${success}" class="flash success" th:text="${success}"></div>

    <form th:action="@{/login}" method="post">
        <label for="email">El. paštas</label>
        <input id="email" name="email" type="email" th:value="${email}" required>

        <label for="password">Slaptažodis</label>
        <input id="password" name="password" type="password" required>

        <button type="submit">Prisijungti</button>
    </form>

    <a class="link-button" th:href="@{/register}">Registruotis</a>
</main>
</body>
</html>
